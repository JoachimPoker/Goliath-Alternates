<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goliath Reg Desk</title>
  <link rel="stylesheet" href="main.css">
</head>
<body class="regdesk-body">

  <div class="regdesk-content-area">

    <!-- IDLE SCREEN: shown when all stations are closed. Rotates through
         the images/videos set in admin, each with its own duration.
         Slide elements (img or video, depending on type) are created and
         removed dynamically here so mixed media types can crossfade. -->
    <div class="regdesk-idle" id="idleScreen" style="display:none;">
    </div>

    <!-- MAIN SCREEN: shown whenever at least one station is open -->
    <div class="regdesk-wrap" id="mainScreen">
      <div class="regdesk-bg-default"></div>
      <div class="regdesk-bg-slides" id="bgSlides"></div>
      <div class="regdesk-watermark" id="watermark">GOLIATH</div>

      <div class="regdesk-header">
        <div class="regdesk-logo" id="headerLogoText">GOLIATH</div>
        <img class="regdesk-logo-img" id="headerLogoImg" alt="" style="display:none;">

        <div class="header-info">
          <div class="header-flight" id="spotlightName"></div>
          <div class="header-status" id="spotlightStatus"></div>
          <div class="header-dots" id="spotlightDots"></div>
        </div>

        <div class="header-upcoming" id="headerUpcoming" style="display:none;">
          <div class="header-upcoming-label" id="headerUpcomingLabel">Upcoming Events Today</div>
          <div class="header-upcoming-list" id="headerUpcomingList"></div>
        </div>
      </div>

      <div class="regdesk-stations-row">
        <div class="regdesk-stations" id="stationsRow"></div>
        <div class="regdesk-empty-slot"></div>
      </div>

      <div class="regdesk-ticker">
        <div class="ticker-content" id="regdeskTicker"></div>
      </div>
    </div>

  </div>

  <button class="regdesk-fullscreen-btn" id="fsBtn" onclick="toggleFullscreen()">⛶ fullscreen</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ticker.js"></script>
  <script>
    // --- FULLSCREEN TOGGLE (small corner button, low-opacity) ---
    // For unattended signage, running Chrome in --kiosk mode pointed at
    // this URL is more reliable than the in-page Fullscreen API (kiosk
    // survives reboots without a click). This button is just a manual
    // fallback if you're testing in a normal browser tab.
    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    }

    // --- IDLE / ACTIVE SWITCHING ---
    function setIdle(isIdle) {
      document.getElementById('idleScreen').style.display = isIdle ? 'block' : 'none';
      document.getElementById('mainScreen').style.display = isIdle ? 'none' : 'flex';
    }

    // --- STATIONS ---
    let stationsSnapshot = null;
    async function loadStations() {
      const { data } = await _supabase.from('stations').select('*').order('station_number');
      const stations = data || [];
      const snapshot = JSON.stringify(stations);
      if (snapshot === stationsSnapshot) return; // nothing changed - don't touch the DOM
      stationsSnapshot = snapshot;

      const row = document.getElementById('stationsRow');
      row.innerHTML = stations.map(s => `
        <div class="station-card">
          <div class="station-badge ${s.is_open ? '' : 'closed'}">${s.is_open ? 'OPEN' : 'CLOSED'}</div>
          <div class="station-serving ${s.is_open ? '' : 'closed'}">${s.is_open ? (s.serving_text || '') : (s.label || ('Station ' + s.station_number))}</div>
        </div>
      `).join('');

      const allClosed = stations.length > 0 && stations.every(s => !s.is_open);
      setIdle(allClosed);
    }

    // --- HEADER STATUS: flight name + alt status, inline in the header row.
    // Rotates through all active events every 5s if there's more than one. ---
    let spotlightTournaments = [];
    let spotlightIndex = 0;
    let spotlightTimer = null;
    let altsSnapshot = null;

    async function loadAlts() {
      const { data } = await _supabase.from('tournaments').select('*').eq('is_active', true).order('created_at');
      const rows = data || [];
      const snapshot = JSON.stringify(rows);
      if (snapshot === altsSnapshot) return; // nothing changed - leave the rotation exactly where it is
      altsSnapshot = snapshot;

      spotlightTournaments = rows;
      spotlightIndex = 0;
      renderSpotlight();

      if (spotlightTimer) clearInterval(spotlightTimer);
      if (spotlightTournaments.length > 1) {
        spotlightTimer = setInterval(() => {
          spotlightIndex = (spotlightIndex + 1) % spotlightTournaments.length;
          renderSpotlight();
        }, 5000);
      }
    }

    function renderSpotlight() {
      updateHeaderMode();

      if (spotlightTournaments.length === 0) return; // header-upcoming panel handles this state

      const nameEl = document.getElementById('spotlightName');
      const statusEl = document.getElementById('spotlightStatus');
      const dotsEl = document.getElementById('spotlightDots');

      const t = spotlightTournaments[spotlightIndex];
      let statusText = '', cls = '';
      if (t.status_mode === 'OPEN') { statusText = 'Open Seating'; cls = 'success'; }
      else if (t.status_mode === 'ALL') { statusText = 'All Alternates'; cls = 'danger'; }
      else if (t.status_mode === 'BREAK') { statusText = `Up To #${t.current_alt_number}`; cls = 'info'; }
      else { statusText = `Up To #${t.current_alt_number}`; cls = 'gold'; }

      nameEl.textContent = t.name;
      statusEl.textContent = statusText;
      statusEl.className = `header-status ${cls}`;

      dotsEl.innerHTML = spotlightTournaments.length > 1
        ? spotlightTournaments.map((_, i) => `<span class="header-dot ${i === spotlightIndex ? 'active' : ''}"></span>`).join('')
        : '';
    }

    // --- HEADER MODE: shows the active-tournament spotlight when
    // something's live; otherwise shows today's schedule instead of a
    // bare "no active events" message, since stations can well be open
    // and busy even with nothing tracked as a live tournament. ---
    function updateHeaderMode() {
      const showActive = spotlightTournaments.length > 0;
      document.getElementById('spotlightName').style.display = showActive ? '' : 'none';
      document.getElementById('spotlightStatus').style.display = showActive ? '' : 'none';
      document.getElementById('spotlightDots').style.display = showActive ? '' : 'none';
      document.getElementById('headerUpcoming').style.display = showActive ? 'none' : 'flex';
    }

    // Bounded and auto-rotating (4 at a time), same pattern used
    // everywhere else on this screen - never grows with how many
    // events happen to be on today.
    const HEADER_UPCOMING_PAGE_SIZE = 1;
    let headerUpcomingRows = [];
    let headerUpcomingPageIndex = 0;
    let headerUpcomingTimer = null;
    let headerUpcomingSnapshot = null;

    async function loadHeaderUpcoming() {
      const today = new Date().toISOString().split('T')[0];
      const { data } = await _supabase.from('tournaments').select('*')
        .eq('tournament_date', today)
        .eq('is_active', false)
        .order('start_time');

      const rows = data || [];
      const snapshot = JSON.stringify(rows);
      if (snapshot === headerUpcomingSnapshot) return; // nothing changed - leave rotation alone
      headerUpcomingSnapshot = snapshot;

      headerUpcomingRows = rows;
      headerUpcomingPageIndex = 0;
      if (headerUpcomingTimer) clearInterval(headerUpcomingTimer);

      renderHeaderUpcomingPage();

      const totalPages = Math.ceil(headerUpcomingRows.length / HEADER_UPCOMING_PAGE_SIZE);
      if (totalPages > 1) {
        headerUpcomingTimer = setInterval(() => {
          headerUpcomingPageIndex = (headerUpcomingPageIndex + 1) % totalPages;
          renderHeaderUpcomingPage();
        }, 6000);
      }
    }

    function renderHeaderUpcomingPage() {
      const labelEl = document.getElementById('headerUpcomingLabel');
      const listEl = document.getElementById('headerUpcomingList');

      if (headerUpcomingRows.length === 0) {
        labelEl.textContent = 'No Events Scheduled Today';
        listEl.innerHTML = '';
        return;
      }

      labelEl.textContent = 'Upcoming Events Today';
      const start = headerUpcomingPageIndex * HEADER_UPCOMING_PAGE_SIZE;
      const pageItems = headerUpcomingRows.slice(start, start + HEADER_UPCOMING_PAGE_SIZE);

      listEl.innerHTML = pageItems.map(t => `
        <div class="header-upcoming-item">${t.name}<span class="time">${t.start_time || ''}</span></div>
      `).join('');
    }

    // --- TICKER BANNER: its own independent toggle (show_on_regdesk),
    // separate from the Website and Alt Desk tickers. ---
    let tickerSnapshot = null;
    async function loadTicker() {
      const { data } = await _supabase.from('messages').select('*').eq('show_on_regdesk', true).order('created_at');
      const rows = data || [];
      const snapshot = JSON.stringify(rows);
      if (snapshot === tickerSnapshot) return; // nothing changed - don't restart the scroll
      tickerSnapshot = snapshot;

      const tickerEl = document.getElementById('regdeskTicker');
      renderSeamlessTicker(tickerEl, rows.map(m => m.text), 100);
    }

    // --- LIVE BACKGROUND: shown behind the header+stations while at
    // least one station is open. Falls back to the default gradient
    // when unset. Cycles through every active image/video in
    // regdesk_live_images, each for its own configured duration - a
    // single item just shows statically. Slide elements are created and
    // removed dynamically (rather than a fixed CSS background) so a
    // mix of images, GIFs, and videos can all crossfade the same way. ---
    let liveImages = [];
    let liveIndex = 0;
    let liveTimer = null;
    let liveCurrentEl = null;
    let liveImagesSnapshot = null;
    let liveElementCache = {}; // item id -> element, reused across turns

    async function loadLiveImages() {
      const { data } = await _supabase.from('regdesk_live_images').select('*').eq('is_active', true).order('sort_order');
      const images = data || [];
      const snapshot = JSON.stringify(images);
      if (snapshot === liveImagesSnapshot) return; // nothing changed - leave the rotation undisturbed
      liveImagesSnapshot = snapshot;

      liveImages = images;
      liveIndex = 0;
      if (liveTimer) clearTimeout(liveTimer);

      const watermark = document.getElementById('watermark');

      // Drop cached elements for anything no longer in the active list.
      const currentIds = new Set(liveImages.map(i => i.id));
      Object.keys(liveElementCache).forEach(id => {
        if (!currentIds.has(id)) {
          liveElementCache[id].remove();
          delete liveElementCache[id];
        }
      });
      liveCurrentEl = null;

      if (liveImages.length === 0) {
        watermark.style.display = 'flex';
        return;
      }

      watermark.style.display = 'none';
      showLiveSlide(liveImages[0]);
      if (liveImages.length > 1) scheduleNextLiveSlide();
    }

    function getOrCreateLiveSlideElement(item) {
      if (liveElementCache[item.id]) return liveElementCache[item.id];

      let el;
      if (item.media_type === 'video') {
        el = document.createElement('video');
        el.autoplay = true;
        el.muted = true;
        el.loop = true;
        el.playsInline = true;
      } else {
        el = document.createElement('img');
        el.alt = '';
      }
      el.src = item.image_url;
      el.className = 'regdesk-bg-image';
      document.getElementById('bgSlides').appendChild(el);
      liveElementCache[item.id] = el;
      return el;
    }

    function showLiveSlide(item) {
      const newEl = getOrCreateLiveSlideElement(item);

      requestAnimationFrame(() => {
        newEl.classList.add('active');
        if (liveCurrentEl && liveCurrentEl !== newEl) {
          liveCurrentEl.classList.remove('active');
        }
        liveCurrentEl = newEl;
      });
    }

    function scheduleNextLiveSlide() {
      const current = liveImages[liveIndex];
      const seconds = (current && current.duration_seconds) || 8;

      liveTimer = setTimeout(() => {
        liveIndex = (liveIndex + 1) % liveImages.length;
        showLiveSlide(liveImages[liveIndex]);
        scheduleNextLiveSlide();
      }, seconds * 1000);
    }

    // --- IDLE ROTATION: shown full-bleed when all stations are closed.
    // Cycles through every active image/video in regdesk_idle_images,
    // each for its own configured duration. A single item just shows
    // statically with no cycling. Slide elements (img or video,
    // depending on type) are created once per item and kept alive in a
    // hidden state between turns, rather than removed and rebuilt every
    // cycle - a video already loaded is never re-fetched just because
    // its turn comes around again; only genuinely new/removed items
    // create or clean up an element. ---
    let idleImages = [];
    let idleIndex = 0;
    let idleTimer = null;
    let idleCurrentEl = null;
    let idleImagesSnapshot = null;
    let idleElementCache = {}; // item id -> element, reused across turns

    async function loadIdleImages() {
      const { data } = await _supabase.from('regdesk_idle_images').select('*').eq('is_active', true).order('sort_order');
      const images = data || [];
      const snapshot = JSON.stringify(images);
      if (snapshot === idleImagesSnapshot) return; // nothing changed - let the rotation keep going undisturbed
      idleImagesSnapshot = snapshot;

      idleImages = images;
      idleIndex = 0;
      if (idleTimer) clearTimeout(idleTimer);

      // Drop cached elements for anything no longer in the active list,
      // so deleted/deactivated items actually get cleaned up.
      const currentIds = new Set(idleImages.map(i => i.id));
      Object.keys(idleElementCache).forEach(id => {
        if (!currentIds.has(id)) {
          idleElementCache[id].remove();
          delete idleElementCache[id];
        }
      });
      idleCurrentEl = null;

      if (idleImages.length === 0) return;

      showIdleSlide(idleImages[0]);
      if (idleImages.length > 1) scheduleNextIdleSlide();
    }

    function getOrCreateIdleSlideElement(item) {
      if (idleElementCache[item.id]) return idleElementCache[item.id];

      let el;
      if (item.media_type === 'video') {
        el = document.createElement('video');
        el.autoplay = true;
        el.muted = true;
        el.loop = true;
        el.playsInline = true;
      } else {
        el = document.createElement('img');
        el.alt = '';
      }
      el.src = item.image_url;
      el.className = 'idle-slide idle-slide-media';
      document.getElementById('idleScreen').appendChild(el);
      idleElementCache[item.id] = el;
      return el;
    }

    function showIdleSlide(item) {
      const newEl = getOrCreateIdleSlideElement(item);

      requestAnimationFrame(() => {
        newEl.classList.add('active');
        if (idleCurrentEl && idleCurrentEl !== newEl) {
          idleCurrentEl.classList.remove('active');
        }
        idleCurrentEl = newEl;
      });
    }

    function scheduleNextIdleSlide() {
      const current = idleImages[idleIndex];
      const seconds = (current && current.duration_seconds) || 8;

      idleTimer = setTimeout(() => {
        idleIndex = (idleIndex + 1) % idleImages.length;
        showIdleSlide(idleImages[idleIndex]);
        scheduleNextIdleSlide();
      }, seconds * 1000);
    }

    // --- SITE LOGO: shared across the website and this video wall.
    // Falls back to the "GOLIATH" text badge wherever it's unset. ---
    let siteLogoSnapshot = null;
    async function loadSiteLogo() {
      const { data } = await _supabase.from('site_settings').select('*').eq('id', 1).maybeSingle();
      const snapshot = JSON.stringify(data);
      if (snapshot === siteLogoSnapshot) return; // nothing changed
      siteLogoSnapshot = snapshot;

      const url = data && data.logo_url;

      const headerText = document.getElementById('headerLogoText');
      const headerImg = document.getElementById('headerLogoImg');

      if (url) {
        headerImg.src = url; headerImg.style.display = ''; headerText.style.display = 'none';
      } else {
        headerImg.style.display = 'none'; headerText.style.display = '';
      }
    }

    // --- INIT + REALTIME ---
    function refreshRegdesk() {
      loadStations();
      loadAlts();
      loadHeaderUpcoming();
      loadIdleImages();
      loadLiveImages();
      loadTicker();
      loadSiteLogo();
    }

    _supabase.channel('public').on('postgres_changes', { event: '*', schema: 'public' }, refreshRegdesk).subscribe();

    refreshRegdesk();

    // Safety net: this screen runs unattended for hours with nobody
    // there to notice or refresh it if a realtime update is ever missed.
    // Poll on a fixed interval regardless, so it can never drift stale
    // for long.
    setInterval(refreshRegdesk, 60000);
  </script>
</body>
</html>
