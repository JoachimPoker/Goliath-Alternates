<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goliath Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <style>
    body { padding-top: 6vh; } 
    .ticker-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 6vh; z-index: 9999; }
  </style>
</head>
<body>
  <div class="ticker-wrap" style="display:none;">
    <div class="ticker-content" id="tickerText"></div>
  </div>

  <div class="container py-4">
    <div class="text-center mb-4 border-bottom border-secondary pb-3">
      <h2 id="hubLogoText" style="color:var(--text-gold); font-weight:900; letter-spacing:1px;">GOLIATH HUB</h2>
      <img id="hubLogoImg" alt="" style="display:none; max-height:60px; margin-bottom:8px;">
      <p class="text-secondary small">LIVE TOURNAMENT TRACKER</p>
    </div>

    <div id="tournamentList"></div>

    <div id="todaySchedule"></div>

    <div id="bannerCarousel" class="banner-carousel" style="display:none;"></div>

    <div class="flat-card mt-5">
      <h4 class="text-white mb-3">Find Your Table</h4>
      <input type="number" id="mapSearch" class="form-control map-input mb-3" placeholder="Enter Table # (e.g. 45)">
      
      <div id="mapContainer" style="position:relative; border: 2px solid #444; border-radius:8px; overflow:hidden; height: 400px; background: #111; cursor: grab;">
        <div id="hallLabel" class="hall-label"></div>
        <div id="svgWrapper-hall3" class="hall-map">
           <p class="text-secondary mt-5" id="mapLoadingText">Loading map...</p>
        </div>
        <div id="svgWrapper-hall5" class="hall-map hall-hidden"></div>
        <div id="svgWrapper-hall4" class="hall-map hall-hidden"></div>
      </div>
      <div id="mapFeedback" class="mt-2 fw-bold text-center text-warning"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ticker.js"></script>
  
  <script>
    // --- 1. LOAD TICKER ---
    async function loadTicker() {
      const { data } = await _supabase.from('messages').select('*').eq('show_on_home', true).order('created_at');
      const tickerBox = document.getElementById('tickerText');
      const wrap = document.querySelector('.ticker-wrap');
      const list = data || [];

      if (list.length === 0) {
        wrap.style.display = 'none';
        document.body.style.paddingTop = '20px';
      } else {
        wrap.style.display = 'flex';
        document.body.style.paddingTop = '8vh';
        renderSeamlessTicker(tickerBox, list.map(m => m.text), 100);
      }
    }

    // --- 2. LOAD HOME ---
    async function loadHome() {
      const [{ data }, { data: settings }] = await Promise.all([
        _supabase.from('tournaments').select('*').eq('is_active', true).order('created_at'),
        _supabase.from('site_settings').select('alerts_enabled').eq('id', 1).maybeSingle()
      ]);
      const alertsEnabled = !settings || settings.alerts_enabled !== false;
      const list = document.getElementById('tournamentList');
      const todayEl = document.getElementById('todaySchedule');

      if (!data || data.length === 0) {
        todayEl.innerHTML = '';
        await renderUpcomingSchedule(list);
        return;
      }
      
      list.innerHTML = data.map(t => {
        // 1. Status logic
        let mainText = "";
        let mainColor = "text-white"; 

        if (t.status_mode === 'OPEN') { 
            mainText = "IMMEDIATE SEATING"; mainColor = "text-success"; 
        } 
        else if (t.status_mode === 'ALL') { 
            mainText = "ALL ALTERNATES"; mainColor = "text-danger"; 
        } 
        else if (t.status_mode === 'BREAK') { 
            mainText = `AFTER BREAK: UP TO #${t.current_alt_number}`; mainColor = "text-info"; 
        } 
        else { 
            mainText = `CALLING UP TO #${t.current_alt_number}`; mainColor = "text-warning"; 
        }

        // 2. Render the Card
        return `
        <div class="flat-card">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge bg-dark border border-secondary">${t.start_time}</span>
            <span class="badge bg-dark border border-secondary">${t.location || 'TBD'}</span>
          </div>
          <div class="tourn-title">${t.name}</div>
          <div class="border-top border-secondary pt-3 mt-2 text-center">
            <div class="display-5 fw-bold ${mainColor}" style="line-height:1.1">${mainText}</div>
          </div>
          ${(alertsEnabled && (t.status_mode === 'BATCH' || t.status_mode === 'BREAK')) ? renderAlertBlock(t) : ''}
        </div>
      `}).join('');

      await renderTodayRemaining(todayEl);
    }

    // --- ALERT ME (push notifications) ---
    function renderAlertBlock(t) {
      return `
        <div class="mt-3 text-center" id="alertBlock-${t.id}">
          <button class="btn btn-outline-warning btn-sm" onclick="showAlertForm('${t.id}')" id="alertBtn-${t.id}">🔔 Alert Me</button>
          <div id="alertForm-${t.id}" style="display:none;">
            <div class="input-group input-group-sm justify-content-center mt-2" style="max-width:220px;margin:0 auto;">
              <input type="number" class="form-control" placeholder="Your alt #" id="alertNum-${t.id}">
              <button class="btn btn-warning" onclick="setAlert('${t.id}')">Set</button>
            </div>
          </div>
        </div>
      `;
    }

    function isIos() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    window.showAlertForm = (id) => {
      // iPhone needs the site installed to the Home Screen first, or
      // notifications can't work at all - point that out directly
      // rather than let them hit a generic "not supported" message
      // after already entering their number.
      if (isIos() && !isStandalone()) {
        document.getElementById(`alertBtn-${id}`).style.display = 'none';
        document.getElementById(`alertForm-${id}`).innerHTML = `
          <div class="small text-warning mt-2" style="max-width:260px;margin:0 auto;">
            On iPhone, alerts only work once this site is added to your Home Screen:
            tap the <strong>Share</strong> icon, then <strong>Add to Home Screen</strong>,
            then open it from that new icon and tap Alert Me again.
          </div>
        `;
        document.getElementById(`alertForm-${id}`).style.display = 'block';
        return;
      }
      document.getElementById(`alertBtn-${id}`).style.display = 'none';
      document.getElementById(`alertForm-${id}`).style.display = 'block';
      document.getElementById(`alertNum-${id}`).focus();
    };

    async function requestNotificationPermission() {
      if (!('Notification' in window)) return false;
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') return false;
      const perm = await Notification.requestPermission();
      return perm === 'granted';
    }

    const VAPID_PUBLIC_KEY = 'BMxNqQvLECwicRo9Wb9-dPTMxG6rtuzL294BcpspmMIln0BLjk2-2qrc-KTw6AGYkKqHQWNemfxTuP9rB2UhKy4';

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function subscribeToPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      const registration = await navigator.serviceWorker.ready;
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      return subscription;
    }

    window.setAlert = async (tournamentId) => {
      const input = document.getElementById(`alertNum-${tournamentId}`);
      const num = parseInt(input.value);
      if (isNaN(num) || num <= 0) { alert('Enter a valid alt number first'); return; }

      const formEl = document.getElementById(`alertForm-${tournamentId}`);
      const originalHtml = formEl.innerHTML;
      formEl.innerHTML = '<div class="text-muted small">Setting up...</div>';

      try {
        const granted = await requestNotificationPermission();
        if (!granted) {
          formEl.innerHTML = '<div class="text-danger small">Notifications are blocked - enable them in your browser settings to use Alert Me.</div>';
          return;
        }

        const subscription = await subscribeToPush();
        if (!subscription) {
          formEl.innerHTML = '<div class="text-danger small">This browser/device doesn\'t support alerts.</div>';
          return;
        }

        const subJson = subscription.toJSON();
        const { error } = await _supabase.from('push_subscriptions').upsert([{
          tournament_id: tournamentId,
          target_alt_number: num,
          endpoint: subJson.endpoint,
          p256dh: subJson.keys.p256dh,
          auth: subJson.keys.auth,
          notified: false
        }], { onConflict: 'endpoint,tournament_id' });

        if (error) {
          formEl.innerHTML = originalHtml;
          alert('Could not set the alert - please try again.');
          return;
        }

        formEl.innerHTML = `<div class="text-success small fw-bold">✓ We'll alert you when it's close to #${num}</div>`;
      } catch (e) {
        console.error(e);
        formEl.innerHTML = originalHtml;
        alert('Something went wrong setting up the alert.');
      }
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // Guarantee appends inline onto the name line; buy-in gets its own
    // line right below; time/location comes last. Renders nothing extra
    // if a field isn't set (true for all existing/imported events until
    // filled in via admin).
    function nameWithGuarantee(t) {
      return t.guarantee ? `${t.name} <span class="schedule-gtd-inline">// ${t.guarantee}</span>` : t.name;
    }
    function buyInLine(t) {
      return t.buy_in ? `<div class="schedule-gtd">Buy-in: ${t.buy_in}</div>` : '';
    }

    // --- 2a. LATER TODAY (shown alongside the active list, so you can
    // see what's next without losing sight of what's live). Below it,
    // a "Show Full Schedule" toggle always appears - collapsed by
    // default, so the page length never grows with the size of the
    // schedule. It's the person's own choice to open it. ---
    async function renderTodayRemaining(container) {
      const today = new Date().toISOString().split('T')[0];
      const { data: todayData } = await _supabase.from('tournaments').select('*')
        .eq('tournament_date', today)
        .eq('is_active', false)
        .eq('is_finished', false)
        .order('start_time');

      const todayRows = todayData || [];

      let html = '';
      if (todayRows.length > 0) {
        html += `
          <div class="schedule-date-header">Later Today</div>
          ${todayRows.map(t => `
            <div class="schedule-item">
              <div class="name">${nameWithGuarantee(t)}</div>
              ${buyInLine(t)}
              <div class="meta">${t.start_time || ''}${t.location ? ' // ' + t.location : ''}</div>
            </div>
          `).join('')}
        `;
      }

      // Always offer the rest of the schedule (every future day, minus
      // today's events already shown above), collapsed by default.
      const { data: restData } = await _supabase.from('tournaments').select('*')
        .eq('is_active', false)
        .eq('is_finished', false)
        .gte('tournament_date', today)
        .order('tournament_date')
        .order('start_time');

      const restRows = (restData || []).filter(t => t.tournament_date !== today);

      if (restRows.length > 0) {
        const dayCount = new Set(restRows.map(t => t.tournament_date)).size;
        const showLabel = `Show Full Schedule (+${dayCount} more day${dayCount === 1 ? '' : 's'})`;
        html += `<div id="fullScheduleMore" style="display:none;">${scheduleGroupsHtml(restRows)}</div>`;
        html += `
          <button id="fullScheduleBtn" class="btn btn-outline-light w-100 mt-2 mb-4" data-show-label="${showLabel}" onclick="toggleFullSchedule()">
            ${showLabel}
          </button>
        `;
      }

      container.innerHTML = html;
    }

    window.toggleFullSchedule = () => {
      const more = document.getElementById('fullScheduleMore');
      const btn = document.getElementById('fullScheduleBtn');
      const isHidden = more.style.display === 'none';
      more.style.display = isHidden ? 'block' : 'none';
      btn.textContent = isHidden ? 'Show Fewer Days' : btn.dataset.showLabel;
    };

    // Shared renderer for a set of tournament rows grouped by date -
    // used both here and in the no-events-live fallback below.
    function scheduleGroupsHtml(rows) {
      const groups = {};
      rows.forEach(t => { (groups[t.tournament_date] = groups[t.tournament_date] || []).push(t); });
      const dateFmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
      return Object.keys(groups).map(date => `
        <div class="schedule-date-header">${dateFmt(date)}</div>
        ${groups[date].map(t => `
          <div class="schedule-item">
            <div class="name">${nameWithGuarantee(t)}</div>
            ${buyInLine(t)}
            <div class="meta">${t.start_time || ''}${t.location ? ' // ' + t.location : ''}</div>
          </div>
        `).join('')}
      `).join('');
    }

    // --- 2b. UPCOMING SCHEDULE (shown when nothing is live) ---
    async function renderUpcomingSchedule(container) {
      const today = new Date().toISOString().split('T')[0];
      const { data } = await _supabase.from('tournaments').select('*')
        .eq('is_active', false)
        .eq('is_finished', false)
        .gte('tournament_date', today)
        .order('tournament_date')
        .order('start_time');

      const rows = data || [];

      if (rows.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5 text-secondary">
            <h3 class="fw-bold" style="opacity:0.5;">NO ACTIVE EVENTS</h3>
            <p>Please check back later.</p>
          </div>
        `;
        return;
      }

      const groups = {};
      rows.forEach(t => { (groups[t.tournament_date] = groups[t.tournament_date] || []).push(t); });

      const dateFmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

      const renderDay = (date) => `
        <div class="schedule-date-header">${dateFmt(date)}</div>
        ${groups[date].map(t => `
          <div class="schedule-item">
            <div class="name">${nameWithGuarantee(t)}</div>
            ${buyInLine(t)}
            <div class="meta">${t.start_time || ''}${t.location ? ' // ' + t.location : ''}</div>
          </div>
        `).join('')}
      `;

      // Long festivals (a dozen+ days of events) make this unreadable if
      // every day renders at once - show the next couple of days, and
      // let people expand the rest if they want to plan further ahead.
      const VISIBLE_DAYS = 2;
      const dates = Object.keys(groups);
      const visibleDates = dates.slice(0, VISIBLE_DAYS);
      const hiddenDates = dates.slice(VISIBLE_DAYS);

      let html = `
        <div class="text-center pb-3 text-secondary">
          <h4 class="fw-bold" style="opacity:0.6;">NO LIVE EVENTS RIGHT NOW</h4>
          <p class="small mb-0">Here's what's coming up</p>
        </div>
      ` + visibleDates.map(renderDay).join('');

      if (hiddenDates.length > 0) {
        const showLabel = `Show Full Schedule (+${hiddenDates.length} more day${hiddenDates.length === 1 ? '' : 's'})`;
        html += `<div id="moreScheduleDays" style="display:none;">${hiddenDates.map(renderDay).join('')}</div>`;
        html += `
          <button id="moreScheduleBtn" class="btn btn-outline-light w-100 mt-2 mb-4" data-show-label="${showLabel}" onclick="toggleMoreSchedule()">
            ${showLabel}
          </button>
        `;
      }

      container.innerHTML = html;
    }

    window.toggleMoreSchedule = () => {
      const more = document.getElementById('moreScheduleDays');
      const btn = document.getElementById('moreScheduleBtn');
      const isHidden = more.style.display === 'none';
      more.style.display = isHidden ? 'block' : 'none';
      btn.textContent = isHidden ? 'Show Fewer Days' : btn.dataset.showLabel;
    };

    // --- 2c. AD BANNER CAROUSEL ---
    let bannerRotateTimer = null;
    let bannerSnapshot = null;
    async function loadBannerCarousel() {
      const { data } = await _supabase.from('banners').select('*').eq('is_active', true).order('sort_order');
      const list = data || [];
      const snapshot = JSON.stringify(list);
      if (snapshot === bannerSnapshot) return; // nothing changed - don't rebuild (and re-fetch any videos) for no reason
      bannerSnapshot = snapshot;

      const box = document.getElementById('bannerCarousel');

      if (bannerRotateTimer) clearInterval(bannerRotateTimer);

      if (list.length === 0) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }

      box.style.display = 'block';
      box.innerHTML = list.map((b, i) => {
        const media = b.media_type === 'video'
          ? `<video src="${b.image_url}" autoplay muted loop playsinline></video>`
          : `<img src="${b.image_url}" alt="">`;
        const inner = b.link_url ? `<a href="${b.link_url}" target="_blank" rel="noopener noreferrer">${media}</a>` : media;
        return `<div class="banner-slide ${i === 0 ? 'active' : ''}">${inner}</div>`;
      }).join('')
        + (list.length > 1 ? `<div class="banner-dots">${list.map((_, i) => `<span class="banner-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}</div>` : '');

      if (list.length > 1) {
        let idx = 0;
        bannerRotateTimer = setInterval(() => {
          const slides = box.querySelectorAll('.banner-slide');
          const dots = box.querySelectorAll('.banner-dot');
          slides[idx].classList.remove('active'); dots[idx].classList.remove('active');
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add('active'); dots[idx].classList.add('active');
        }, 5000);
      }
    }

    // --- 2d. SITE LOGO ---
    async function loadSiteLogo() {
      const { data } = await _supabase.from('site_settings').select('*').eq('id', 1).maybeSingle();
      const url = data && data.logo_url;
      const text = document.getElementById('hubLogoText');
      const img = document.getElementById('hubLogoImg');

      if (url) {
        img.src = url; img.style.display = ''; text.style.display = 'none';
      } else {
        img.style.display = 'none'; text.style.display = '';
      }
    }

    // --- 3. INTERACTIVE MAP LOGIC ---
    const HALLS = [
      { key: 'hall3', file: 'hall3.svg', label: 'Hall 3' },
      { key: 'hall5', file: 'hall5.svg', label: 'Hall 5' },
      { key: 'hall4', file: 'hall4.svg', label: 'Hall 4' }
    ];
    const hallState = {};
    let currentHallKey = 'hall3';

    // Illustrator-exported SVGs tend to reuse generic class names (st0,
    // st1, cls-1...) across separately-exported files. An embedded
    // <style> block inside an injected SVG applies globally to the whole
    // page, not just to its own SVG - so once multiple hall files are
    // loaded together, two files sharing a class name silently override
    // each other's colors (this was the actual cause of Hall 5 showing
    // a white background: hall4.svg's ".st2 { fill:#fff }" was
    // clobbering hall5.svg's own ".st2 { fill:none }", which its
    // boundary and every table rely on). Renaming every class per-hall
    // here avoids that regardless of what naming scheme was exported.
    function namespaceSvgClasses(svgText, key) {
      const styleMatch = svgText.match(/<style>([\s\S]*?)<\/style>/);
      if (!styleMatch) return svgText;

      const styleBlock = styleMatch[1];
      const classNames = new Set();
      // Class selectors always start with a letter - this matters
      // because without it, a decimal value like "font-size: 43.8px"
      // gets misread as a class selector ".8px", and renaming it then
      // corrupts the actual value into "43.8px-hall5" (invalid CSS,
      // silently falls back to the browser default size). This is
      // exactly what was making Hall 5's table numbers render tiny.
      const classRegex = /\.([a-zA-Z][a-zA-Z0-9_-]*)/g;
      let m;
      while ((m = classRegex.exec(styleBlock)) !== null) classNames.add(m[1]);
      if (classNames.size === 0) return svgText;

      const renameMap = {};
      classNames.forEach(cls => { renameMap[cls] = `${cls}-${key}`; });

      let newStyleBlock = styleBlock;
      classNames.forEach(cls => {
        newStyleBlock = newStyleBlock.replace(new RegExp(`\\.${cls}\\b`, 'g'), `.${renameMap[cls]}`);
      });
      let result = svgText.replace(styleBlock, newStyleBlock);

      result = result.replace(/class="([^"]*)"/g, (full, classList) => {
        const updated = classList.split(/\s+/).map(c => renameMap[c] || c).join(' ');
        return `class="${updated}"`;
      });

      return result;
    }

    async function initMaps() {
      for (const hall of HALLS) {
        const wrapper = document.getElementById(`svgWrapper-${hall.key}`);
        wrapper.innerHTML = '';

        try {
          const response = await fetch(hall.file);
          if (!response.ok) throw new Error("File not found");
          let svgText = await response.text();
          svgText = namespaceSvgClasses(svgText, hall.key);

          const mapDiv = document.createElement('div');
          mapDiv.style.width = '100%';
          mapDiv.style.height = '100%';
          mapDiv.innerHTML = svgText;

          const svgElement = mapDiv.querySelector('svg');
          if (svgElement) {
            svgElement.style.width = '100%';
            svgElement.style.height = '100%';
            svgElement.id = `svg-${hall.key}`;

            // Each hall's own entrance marker should already be named
            // entrance-hall3/hall4/hall5 in the source file. Fallback
            // below just in case any file still has the old shared
            // "entrance-main" id from before per-hall renaming.
            if (!svgElement.querySelector(`#entrance-${hall.key}`)) {
              const legacyEntrance = svgElement.querySelector('#entrance-main');
              if (legacyEntrance) legacyEntrance.id = `entrance-${hall.key}`;
            }
          }
          wrapper.appendChild(mapDiv);

          hallState[hall.key] = { svgEl: svgElement, wrapper, panzoom: null, label: hall.label };
        } catch (e) {
          wrapper.innerHTML = `<p class="text-danger mt-5">Could not load ${hall.file}. Ensure it is in the same folder.</p>`;
          hallState[hall.key] = { svgEl: null, wrapper, panzoom: null, label: hall.label };
        }
      }

      // One shared wheel listener that always routes to whichever
      // hall is currently visible, rather than stacking a separate
      // listener per hall.
      document.getElementById('mapContainer').addEventListener('wheel', (e) => {
        const state = hallState[currentHallKey];
        if (state && state.panzoom) state.panzoom.zoomWithWheel(e);
      });

      showHall('hall3');
    }

    // Panzoom needs the element visible to measure it correctly, so it's
    // created the first time a hall is actually shown rather than
    // upfront for all three (two of which start hidden).
    function ensurePanzoom(key) {
      const state = hallState[key];
      if (!state || state.panzoom || !state.svgEl) return;
      state.panzoom = Panzoom(state.wrapper, { maxScale: 4, minScale: 1, contain: 'outside' });
    }

    function showHall(key) {
      currentHallKey = key;
      HALLS.forEach(h => {
        document.getElementById(`svgWrapper-${h.key}`).classList.toggle('hall-hidden', h.key !== key);
      });
      document.getElementById('hallLabel').textContent = (hallState[key] && hallState[key].label) || '';

      ensurePanzoom(key);
      const state = hallState[key];
      if (state && state.panzoom) state.panzoom.reset({ animate: false });
    }

    function clearPathAndHighlights() {
      document.querySelectorAll('.table-highlight').forEach(el => el.classList.remove('table-highlight'));
      document.querySelectorAll('.hall-map svg').forEach(svg => svg.classList.remove('map-dimmed'));
      document.querySelectorAll('#dynamic-path').forEach(p => p.remove());
    }

    document.getElementById('mapSearch').addEventListener('input', (e) => {
      const tableNum = parseInt(e.target.value);
      const feedback = document.getElementById('mapFeedback');
      clearPathAndHighlights();

      if (isNaN(tableNum)) { feedback.innerText = ''; return; }

      // Table numbers are unique across all three halls combined, so
      // search each hall's own SVG until one has it.
      let foundHallKey = null;
      let tableEl = null;
      for (const hall of HALLS) {
        const state = hallState[hall.key];
        if (!state || !state.svgEl) continue;
        const el = state.svgEl.querySelector(`#Table-${tableNum}`);
        if (el) { foundHallKey = hall.key; tableEl = el; break; }
      }

      if (!tableEl) {
        feedback.innerText = `Table ${tableNum} not found.`;
        return;
      }
      feedback.innerText = "";

      showHall(foundHallKey);

      const svgMap = hallState[foundHallKey].svgEl;
      const entranceEl = svgMap.querySelector(`#entrance-${foundHallKey}`);

      svgMap.classList.add('map-dimmed');
      tableEl.classList.add('table-highlight');

      if (entranceEl) {
        try {
            const tBox = tableEl.getBBox();
            const eBox = entranceEl.getBBox();
            const tX = tBox.x + (tBox.width / 2);
            const tY = tBox.y + (tBox.height / 2);
            const eX = eBox.x + (eBox.width / 2);
            const eY = eBox.y + (eBox.height / 2);

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("id", "dynamic-path");
            path.setAttribute("class", "wayfinder-path");
            path.setAttribute("d", `M ${eX} ${eY} L ${eX} ${tY} L ${tX} ${tY}`);
            
            svgMap.appendChild(path);
        } catch(error) {
            console.log("Could not draw path.", error);
        }
      }
    });

    // --- SIMPLE VISIT TRACKING ---
    // Logs one row per browser session (not per page load/refresh),
    // so admin can see rough visit counts without needing a third-party
    // analytics account. Fails silently - a tracking hiccup should
    // never affect the actual page.
    function classifyReferrer() {
      if (!document.referrer) return 'Direct';
      try {
        const host = new URL(document.referrer).hostname.replace(/^www\./, '');
        return host || 'Direct';
      } catch (e) {
        return 'Direct';
      }
    }

    function classifyDevice() {
      return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
    }

    function logPageView() {
      const sessionKey = 'goliath_view_logged';
      if (sessionStorage.getItem(sessionKey)) return;
      sessionStorage.setItem(sessionKey, '1');
      _supabase.from('page_views').insert([{
        page: 'home',
        referrer: classifyReferrer(),
        device_type: classifyDevice()
      }]).then(() => {}).catch(() => {});
    }
    logPageView();

    window.addEventListener('DOMContentLoaded', initMaps);

    // Initial Loaders
    function refreshAll() {
      loadHome();
      loadTicker();
      loadBannerCarousel();
      loadSiteLogo();
    }

    _supabase.channel('public').on('postgres_changes', {event:'*', schema:'public'}, refreshAll).subscribe();
    refreshAll();

    // Safety net: realtime is the primary way this page updates, but a
    // websocket can occasionally miss an update or quietly drop when a
    // phone backgrounds the tab for a while - which is exactly when
    // someone would notice a stale "ended" event still showing. Two
    // belt-and-braces fixes rather than relying on realtime alone:
    setInterval(refreshAll, 30000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshAll();
    });
  </script>
</body>
</html>
