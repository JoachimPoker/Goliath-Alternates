<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goliath Display</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="ticker-wrap">
    <div class="ticker-content" id="tickerText"></div>
  </div>

  <div class="split-screen">
    <div class="col-map">
      <div class="map-frame" id="mapFrame"></div>
      <div class="qr-section">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.goliathalts.com" class="qr-img">
        <p style="margin: 0.5vh 0 0 0; font-size: 1.5vh;">SCAN FOR ALERTS</p>
      </div>
    </div>

    <div class="col-list">
      <div class="header-gold" id="listHeader">ALTERNATE LIST</div>
      <div id="tvList" style="width: 100%;"></div>
      <div class="tv-page-dots" id="tvPageDots"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ticker.js"></script>
  <script>
    // 1. Load Tournaments - shown 4 at a time. If there are more, it
    // rotates through pages rather than shrinking text to cram them all
    // in, so it always stays a comfortable, readable size.
    const TV_PAGE_SIZE = 4;
    let tvTournaments = [];
    let tvPageIndex = 0;
    let tvPageTimer = null;
    let tvActiveSnapshot = null;

    async function loadTV() {
      const { data } = await _supabase.from('tournaments').select('*').eq('is_active', true).order('created_at');
      const rows = data || [];
      const snapshot = JSON.stringify(rows);

      if (rows.length === 0) {
        // No active events - hand off to the schedule fallback, which
        // has its own independent change-check so it can still pick up
        // new upcoming events without needlessly re-rendering (and
        // flickering) when nothing's actually changed.
        if (snapshot !== tvActiveSnapshot) {
          tvActiveSnapshot = snapshot;
          tvTournaments = [];
          tvPageIndex = 0;
          if (tvPageTimer) { clearInterval(tvPageTimer); tvPageTimer = null; }
          document.getElementById('tvPageDots').innerHTML = '';
        }
        await renderUpcomingScheduleTV(document.getElementById('tvList'));
        return;
      }

      if (snapshot === tvActiveSnapshot) return; // nothing changed - leave pagination exactly where it is
      tvActiveSnapshot = snapshot;

      // Entering/staying in active mode - stop any schedule-fallback
      // page rotation left running from before.
      if (schedulePageTimer) { clearInterval(schedulePageTimer); schedulePageTimer = null; }

      tvTournaments = rows;
      tvPageIndex = 0;
      if (tvPageTimer) { clearInterval(tvPageTimer); tvPageTimer = null; }

      document.getElementById('listHeader').textContent = 'ALTERNATE LIST';
      renderTVPage();

      const totalPages = Math.ceil(tvTournaments.length / TV_PAGE_SIZE);
      if (totalPages > 1) {
        tvPageTimer = setInterval(() => {
          tvPageIndex = (tvPageIndex + 1) % totalPages;
          renderTVPage();
        }, 8000);
      }
    }

    function renderTVPage() {
      const container = document.getElementById('tvList');
      const start = tvPageIndex * TV_PAGE_SIZE;
      const pageItems = tvTournaments.slice(start, start + TV_PAGE_SIZE);

      container.innerHTML = pageItems.map(t => {
        let statusHtml = "";

        if (t.status_mode === 'OPEN') statusHtml = `<span class="stat-success">IMMEDIATE SEATING</span>`;
        else if (t.status_mode === 'ALL') statusHtml = `<span class="stat-danger">ALL ALTERNATES</span>`;
        else if (t.status_mode === 'BREAK') statusHtml = `<span class="stat-info">AFTER BREAK: #${t.current_alt_number}</span>`;
        else statusHtml = `ALTS UP TO <span class="stat-gold">#${t.current_alt_number}</span>`;

        return `
        <div class="tourn-item">
          <div class="tourn-title">${t.name}</div>
          <div class="tourn-info">${t.start_time} // ${t.location || 'TBD'}</div>
          <div class="tourn-status">${statusHtml}</div>
        </div>`;
      }).join('');

      const totalPages = Math.ceil(tvTournaments.length / TV_PAGE_SIZE);
      const dotsEl = document.getElementById('tvPageDots');
      dotsEl.innerHTML = totalPages > 1
        ? Array.from({ length: totalPages }, (_, i) => `<span class="tv-page-dot ${i === tvPageIndex ? 'active' : ''}"></span>`).join('')
        : '';

      fitTVList();
    }

    // 1a. Safety net: with only 4 events per page this should rarely be
    // needed, but if a couple of names are unusually long it nudges the
    // text down just enough to avoid clipping, rather than overflowing.
    // Sets inline pixel sizes directly rather than relying on a CSS
    // variable main.css needs to define, so it keeps working even if
    // this file and main.css ever drift out of sync.
    //
    // Important: this measures the actual content elements (header,
    // tvList, dots) directly, NOT .col-list's own scrollHeight. Because
    // .col-list is itself a flex container with a fixed height, its
    // scrollHeight was found to always equal its clientHeight regardless
    // of how much its content actually shrank - comparing against it
    // never detected a genuine reduction, and the loop shrank text
    // pointlessly all the way to the floor.
    function fitTVList() {
      const colList = document.querySelector('.col-list');
      const tvList = document.getElementById('tvList');
      const header = document.querySelector('.header-gold');
      const dots = document.getElementById('tvPageDots');
      if (!colList || !tvList) return;

      const vh = window.innerHeight / 100;

      const titles = tvList.querySelectorAll('.tourn-title');
      const infos = tvList.querySelectorAll('.tourn-info');
      const statuses = tvList.querySelectorAll('.tourn-status');
      const items = tvList.querySelectorAll('.tourn-item');

      const dateHeaders = tvList.querySelectorAll('.schedule-date-header');
      const schedItems = tvList.querySelectorAll('.schedule-item');
      const schedNames = tvList.querySelectorAll('.schedule-item .name');
      const schedMetas = tvList.querySelectorAll('.schedule-item .meta');

      if (items.length === 0 && schedItems.length === 0) return;

      function applyScale(scale) {
        if (items.length > 0) {
          titles.forEach(el => { el.style.fontSize = (5.5 * vh * scale) + 'px'; el.style.marginBottom = (0.6 * vh * scale) + 'px'; });
          infos.forEach(el => { el.style.fontSize = (2 * vh * scale) + 'px'; el.style.marginBottom = (0.6 * vh * scale) + 'px'; });
          statuses.forEach(el => el.style.fontSize = (4.5 * vh * scale) + 'px');
          items.forEach(el => { el.style.marginBottom = (2.5 * vh * scale) + 'px'; el.style.paddingBottom = (0.6 * vh * scale) + 'px'; });
        } else {
          dateHeaders.forEach(el => { el.style.fontSize = (3 * vh * scale) + 'px'; el.style.margin = (3 * vh * scale) + 'px 0 ' + (1.5 * vh * scale) + 'px'; });
          schedItems.forEach(el => { el.style.padding = (1.5 * vh * scale) + 'px 2vh'; el.style.marginBottom = (1.5 * vh * scale) + 'px'; });
          schedNames.forEach(el => el.style.fontSize = (3.2 * vh * scale) + 'px');
          schedMetas.forEach(el => { el.style.fontSize = (2 * vh * scale) + 'px'; el.style.marginTop = (0.5 * vh * scale) + 'px'; });
        }
      }

      function measureContentHeight() {
        return (header ? header.offsetHeight : 0) + tvList.scrollHeight + (dots ? dots.offsetHeight : 0);
      }

      const colStyle = getComputedStyle(colList);
      const paddingV = (parseFloat(colStyle.paddingTop) || 0) + (parseFloat(colStyle.paddingBottom) || 0);
      const availableHeight = colList.clientHeight - paddingV;

      let scale = 1;
      applyScale(scale);

      let guard = 0;
      while (measureContentHeight() > availableHeight && scale > 0.15 && guard < 80) {
        scale -= 0.02;
        applyScale(scale);
        guard++;
      }
    }

    // 1b. Upcoming schedule fallback (shown when nothing is live) -
    // paginated the same way the active list is: a fixed number of
    // events per page, auto-rotating, rather than dumping the whole
    // festival schedule into one shrunk-to-fit column.
    const SCHEDULE_PAGE_SIZE = 6;
    let scheduleSnapshot = null;
    let scheduleRows = [];
    let schedulePageIndex = 0;
    let schedulePageTimer = null;

    async function renderUpcomingScheduleTV(container) {
      const today = new Date().toISOString().split('T')[0];
      const { data } = await _supabase.from('tournaments').select('*')
        .eq('is_active', false)
        .gte('tournament_date', today)
        .order('tournament_date')
        .order('start_time');

      const rows = data || [];
      const snapshot = JSON.stringify(rows);
      if (snapshot === scheduleSnapshot) return; // nothing changed - leave the page rotation exactly where it is
      scheduleSnapshot = snapshot;

      document.getElementById('listHeader').textContent = rows.length ? 'UPCOMING EVENTS' : 'ALTERNATE LIST';

      if (schedulePageTimer) { clearInterval(schedulePageTimer); schedulePageTimer = null; }

      if (rows.length === 0) {
        document.getElementById('tvPageDots').innerHTML = '';
        container.innerHTML = '<div class="tourn-title" style="color:#555">NO ACTIVE EVENTS</div>';
        return;
      }

      scheduleRows = rows;
      schedulePageIndex = 0;
      renderSchedulePage();

      const totalPages = Math.ceil(scheduleRows.length / SCHEDULE_PAGE_SIZE);
      if (totalPages > 1) {
        schedulePageTimer = setInterval(() => {
          schedulePageIndex = (schedulePageIndex + 1) % totalPages;
          renderSchedulePage();
        }, 8000);
      }
    }

    function nameWithGuarantee(t) {
      return t.guarantee ? `${t.name} <span class="schedule-gtd-inline">// ${t.guarantee}</span>` : t.name;
    }
    function buyInLine(t) {
      return t.buy_in ? `<div class="schedule-gtd">Buy-in: ${t.buy_in}</div>` : '';
    }

    function renderSchedulePage() {
      const container = document.getElementById('tvList');
      const start = schedulePageIndex * SCHEDULE_PAGE_SIZE;
      const pageItems = scheduleRows.slice(start, start + SCHEDULE_PAGE_SIZE);

      const dateFmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

      let lastDate = null;
      let html = '';
      pageItems.forEach(t => {
        if (t.tournament_date !== lastDate) {
          html += `<div class="schedule-date-header">${dateFmt(t.tournament_date)}</div>`;
          lastDate = t.tournament_date;
        }
        html += `
          <div class="schedule-item">
            <div class="name">${nameWithGuarantee(t)}</div>
            ${buyInLine(t)}
            <div class="meta">${t.start_time || ''}${t.location ? ' // ' + t.location : ''}</div>
          </div>
        `;
      });

      container.innerHTML = html;

      const totalPages = Math.ceil(scheduleRows.length / SCHEDULE_PAGE_SIZE);
      const dotsEl = document.getElementById('tvPageDots');
      dotsEl.innerHTML = totalPages > 1
        ? Array.from({ length: totalPages }, (_, i) => `<span class="tv-page-dot ${i === schedulePageIndex ? 'active' : ''}"></span>`).join('')
        : '';

      fitTVList();
    }

    // 2. Load Ticker Messages
// public/display.html

let displayTickerSnapshot = null;
async function loadTicker() {
  const { data } = await _supabase.from('messages').select('*').eq('show_on_display', true).order('created_at');
  const tickerBox = document.getElementById('tickerText');
  const wrap = document.querySelector('.ticker-wrap');
  const split = document.querySelector('.split-screen');
  const list = data || [];
  const snapshot = JSON.stringify(list);
  if (snapshot === displayTickerSnapshot) return; // nothing changed - don't restart the scroll
  displayTickerSnapshot = snapshot;

  if (list.length === 0) {
    wrap.style.display = 'none';
    split.style.marginTop = '0';
    split.style.height = '100vh';
  } else {
    wrap.style.display = 'flex';
    split.style.marginTop = '6vh';
    split.style.height = '94vh';
    renderSeamlessTicker(tickerBox, list.map(m => m.text), 100);
  }
}

    // 3. Left-panel carousel (floor plans, ads, whatever you like).
    // Each image has its own duration; a single image just shows
    // statically. Falls back gracefully if the table is empty.
    let mapImages = [];
    let mapIndex = 0;
    let mapTimer = null;
    let mapCurrentEl = null;
    let mapImagesSnapshot = null;
    const MAP_TRANSITION_MS = 1000;

    async function loadMapCarousel() {
      const { data } = await _supabase.from('display_carousel_images').select('*').eq('is_active', true).order('sort_order');
      const images = data || [];
      const snapshot = JSON.stringify(images);
      if (snapshot === mapImagesSnapshot) return; // nothing changed - let the rotation keep going undisturbed
      mapImagesSnapshot = snapshot;

      mapImages = images;
      mapIndex = 0;
      if (mapTimer) clearTimeout(mapTimer);

      const mapFrame = document.getElementById('mapFrame');
      mapFrame.querySelectorAll('.map-img').forEach(el => el.remove());
      mapCurrentEl = null;

      if (mapImages.length === 0) return;

      showMapSlide(mapImages[0]);
      if (mapImages.length > 1) scheduleNextMapSlide();
    }

    function createMapSlideElement(item) {
      let el;
      if (item.media_type === 'video') {
        el = document.createElement('video');
        el.autoplay = true;
        el.muted = true;
        el.loop = true;
        el.playsInline = true;
      } else {
        el = document.createElement('img');
        el.alt = '';
      }
      el.src = item.image_url;
      el.className = 'map-img';
      return el;
    }

    function showMapSlide(item) {
      const mapFrame = document.getElementById('mapFrame');
      const newEl = createMapSlideElement(item);
      mapFrame.appendChild(newEl);

      requestAnimationFrame(() => {
        newEl.classList.add('active');
        if (mapCurrentEl) {
          const oldEl = mapCurrentEl;
          oldEl.classList.remove('active');
          setTimeout(() => oldEl.remove(), MAP_TRANSITION_MS);
        }
        mapCurrentEl = newEl;
      });
    }

    function scheduleNextMapSlide() {
      const current = mapImages[mapIndex];
      const seconds = (current && current.duration_seconds) || 10;

      mapTimer = setTimeout(() => {
        mapIndex = (mapIndex + 1) % mapImages.length;
        showMapSlide(mapImages[mapIndex]);
        scheduleNextMapSlide();
      }, seconds * 1000);
    }

    // --- INIT + REALTIME ---
    // Ticker must run first: it sets .split-screen's height/margin
    // depending on whether there are messages, and the tournament list
    // needs that final size settled before it measures itself against
    // it. Doing this out of order was why the list wasn't shrinking
    // correctly - it was fitting against a taller box than what was
    // actually visible.
    async function refreshDisplay() {
      await loadTicker();
      await loadTV();
      await loadMapCarousel();
    }

    _supabase.channel('public').on('postgres_changes', {event:'*', schema:'public'}, refreshDisplay).subscribe();

    window.addEventListener('resize', () => fitTVList());

    refreshDisplay();

    // Safety net: this screen runs unattended for hours with nobody
    // there to notice or refresh it if a realtime update is ever missed.
    // Poll on a fixed interval regardless, so it can never drift stale
    // for long.
    setInterval(refreshDisplay, 60000);
  </script>
</body>
</html>
